<div class="featured-posts featured-posts--extra-highlight">
  {%- assign post = site.posts.first %}
  <div class="post-teaser">
    <a href="{{ post.url }}" class="post-title">{{ post.title }}</a>

    {%- include posts/meta.html post=post %}

    <div class="excerpt">{{ post.summary | default: post.excerpt | markdownify }}</div>
  </div>

  {%- assign latest_release = site.releases | reverse | first %}
  <div class="releases-info">
    <strong>Latest release</strong>

    <a href="{{ latest_release.url }}" class="hex">Crystal {{ latest_release.version }}</a>

    <div class="link-actions">
      <a href="/releases/">All release notes</a>
    </div>
  </div>
</div>
