<div class="top-sponsors top-sponsors--{{ include.tier }}">
  {% assign key = "sponsor_logos_" | append: include.tier %}
  {%- for sponsor in site.data[key] %}
    <a href="{{ sponsor.url }}" rel="nofollow sponsored" title="{{- sponsor.name }}">
      <img src="/assets/{{ sponsor.logo }}" alt="{{- sponsor.name }}">
      {% if include.tier == "corporate" %}
        {{- sponsor.name }}
      {% endif %}
    </a>
  {%- endfor %}
</div>
